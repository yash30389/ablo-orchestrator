version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ablo-api
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ablo-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18
    container_name: ablo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ablo
    ports:
      - "5432:5432"

