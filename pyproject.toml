[project]
name = "ablo-orchestrator"
version = "0.1.0"
description = "Autonomous Business Logic Orchestrator"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv",
  "redis",
  "celery",
  "sqlalchemy",
  "psycopg2-binary",
  "httpx",
  "pyyaml",
  "structlog"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

